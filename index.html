<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa con Geolocalización</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <header class="intro">
            <h1>Mi ubicación actual</h1>
            <p>Tu ubicación se mostrará en el siguiente mapa.</p>
        </header>

        <section class="map-card">
            <div id="map" aria-label="Mapa con tu ubicación"></div>

            <div class="status" id="status" role="status" aria-live="polite">
                Buscando tu ubicación…
            </div>
        </section>

        <footer class="actions">
            <p class="coords" id="coords">Coordenadas: pendientes</p>
            <button type="button" id="recenter" disabled>Centrar en mi ubicación</button>
        </footer>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>

</html>
